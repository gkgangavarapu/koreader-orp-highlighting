name: release-plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r dist/orp_highlighting.koplugin.zip orp_highlighting.koplugin
          cd dist
          sha256sum orp_highlighting.koplugin.zip > orp_highlighting.koplugin.zip.sha256
          cat orp_highlighting.koplugin.zip.sha256

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/orp_highlighting.koplugin.zip
            dist/orp_highlighting.koplugin.zip.sha256
          name: ORP Highlighting ${{ github.ref_name }}
          body: |
            ORP Highlighting plugin.

            Install: extract `orp_highlighting.koplugin.zip` and copy the
            `orp_highlighting.koplugin` folder into `koreader/plugins/`.

            Requires a KOReader build with the visible-glyph engine API
            (`document:orpVisibleWords`). See README for details.
